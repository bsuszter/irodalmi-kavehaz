<!doctype html>
<html lang="hu"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Irodalmi kávéház</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5efe4;color:#30251e;font:18px/1.6 system-ui,sans-serif}header{background:#34251e;color:#fff4dc;padding:34px 6%;border-bottom:6px solid #b88a4e}header h1{font:700 clamp(32px,5vw,52px) Georgia;margin:0}header p{margin:8px 0}main{max-width:940px;margin:auto;padding:24px}nav{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}button,a.link{font:inherit;cursor:pointer;border:1px solid #8a6848;border-radius:10px;padding:10px 16px;background:#fffaf1;color:#49301d;text-decoration:none}button.primary{background:#684329;color:white}button:disabled{opacity:.6;cursor:default}button:focus-visible,a:focus-visible{outline:3px solid #007c91;outline-offset:3px}.panel{background:#fffaf2;border:1px solid #ddc9ad;border-radius:16px;padding:clamp(18px,4vw,36px);margin-bottom:18px}h2,h3{font-family:Georgia;color:#593b25;line-height:1.2}h2{font-size:32px;margin-top:0}h3{font-size:24px}a{color:#725027}small{color:#685746}.choices{display:grid;gap:10px}.choices button{text-align:left}.choices button.selected{background:#e0c8a0;border:2px solid #684329}.good{color:#17613d}.bad{color:#9c3227}progress{width:100%;accent-color:#88603d}iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px}details{margin:12px 0}summary{cursor:pointer;font-weight:bold}.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.menu button{text-align:left;padding:20px}.menu strong{display:block;font-size:20px}footer{text-align:center;padding:20px;color:#695747} .tag{font-size:14px;letter-spacing:2px;text-transform:uppercase} 
</style>
<header><div class="tag">Budapest · 1894 és a századforduló</div><h1>Irodalmi kávéház</h1><p>Kávéházi kalauz és pontszerző barangolás</p></header>
<main><nav><button onclick="go('home')">☕ Kezdőlap</button><button onclick="go('learn',0)">📖 Kalauz</button><button onclick="go('quiz')">🎟 Próbatétel</button></nav><div id="app"></div></main><footer>Nyolcadikos irodalmi projekt · Források a kalauzban</footer>
<script>
const sections=[
{title:"A századforduló internete",icon:"📰",video:"bcO33l1lO0I",text:"A kávéház a hírek, találkozások és beszélgetések helye volt. A századforduló Budapestjén több száz működött. Újságok, biliárd, kártya és egyes helyeken élőzene várta a vendégeket. Sok embernek a szűkös, kényelmetlen lakás helyett a fűtött, világos kávéház adott munkahelyet. Az írók jelenléte a tulajdonosnak is megérte: híres vendégeik másokat vonzottak. Egyes helyek éjjel-nappal nyitva tartottak.",task:"Beszéljétek meg: miért nevezhető a kávéház a kor internetének? Gyűjtsetek három okot, amiért valaki egész nap ott maradhatott."},
{title:"Írók és főpincérek",icon:"✒️",video:"uijRnHp6FVo",text:"A New York Kávéház 1894-ben nyílt meg a New York biztosítótársaság palotájában. Heltai Jenő, Ady Endre, Kosztolányi Dezső és Krúdy Gyula neve is kapcsolódik a kávéházi világhoz. Az írók papírt és tintát kaphattak; a főpincér hitelt adhatott és szerkesztőkkel is összeismertethette őket. A videó szerint Ady lencsefőzeléket kedvelt, Kosztolányi román kávét (kávé, rum, kenyérbél). A Krúdy-anekdotában az író koporsókat vitetett a kávéház elé, hogy barátja reggelit kapjon.",task:"Miért volt a főpincér több egyszerű kiszolgálónál? Meséljétek el egymásnak a Krúdy-anekdotát."},
{title:"Beszélsz kávéháziul?",icon:"🍰",text:"A korabeli kávéházi nyelv tele volt különös szavakkal. Ismerjétek meg a szótár válogatását, majd próbáljatok egymásnak korabeli rendelést feladni!",task:"Egyikőtök legyen a pincér, másikótok a vendég. Rendeljetek ételt és italt, majd cseréljetek szerepet.",words:[["Írótál","Sonka, szalámi, sajt; a New York specialitása."],["Melanzs","Fele tej, fele kávé."],["Japán bomba","Fagylalttal és tejberizzsel töltött piskótadesszert."],["Krahedli","Szénsavas üdítő."],["Kapucíner","Sötétre pörkölt kávé tejszínhabbal, kakaóval."],["Bátori-pirítós","Pirítós sült szalonnával és fokhagymával."],["Javító","Kis ingyenes kiegészítő, például tej vagy cukor."],["Főúr","Főpincér."],["Pikoló","Pincérfiú; italnévként kis feketekávé is."],["Felugrálós","Mindig indul, mégsem megy el."],["Bohém","Kötetlen életű művész vagy fiatal."],["Hordár","Poggyászt, üzenetet szállító, vörös sapkás küldönc."],["Stammgast","Törzsvendég."],["Kávéházi Konrád","Fontoskodó mindentudó."],["Csúzlicédula","A főpincér adósainak jegyzéke."],["Kutyanyelv","Jegyzeteléshez adott blokkpapír."],["Nyehó","A New York beceneve."],["Mélyvíz","A New York mélyített alsó szintje."],["Veseasztal","A kritikusok törzshelye."],["Macherlón","Borravaló."],["Ez nekem nem kávéház","Nem érdekel."]]},
{title:"A New York akkor és most",icon:"🏛️",text:"A palota ma is áll a VII. kerületben, az Erzsébet körút 9–11. alatt. A kávéház a földszinten található; az épületben az Anantara New York Palace Budapest szálloda működik. A Blaha Lujza tér közelében járunk. Nézzétek meg a palota díszes homlokzatát és belső tereit a hivatalos honlapon, majd tervezzetek utat a Nyugati pályaudvartól!",task:"Keressétek meg a címet, a szálloda nevét és a közeli villamosokat. Nézzétek meg az épület fotóit: milyen részletek árulkodnak a palota eleganciájáról?",links:[["Hivatalos honlap","https://newyorkcafe.hu/"],["Történet és építészet","https://newyorkcafe.hu/kavehaz/"],["Szálloda","https://www.anantara.com/en/new-york-palace-budapest"],["Térkép és útvonal","https://www.google.com/maps/search/?api=1&query=New+York+Cafe+Budapest"]]}
];
const questions=[
["A kávéház működése","Miért nevezzük a kávéházat a kor internetének?",["Mert híreket, újságokat és beszélgetőtársakat találtak ott.","Mert számítógépek működtek benne.","Mert csak táviratokat továbbítottak."],0],
["A kávéház működése","Miért vonzották a tulajdonosok a híres írókat?",["Hogy bezárhassanak korábban.","Mert más vendégeket is odavonzottak.","Mert az írók fizették az összes számlát."],1],
["A kávéház működése","Miért dolgoztak sokan a kávéházban?",["Mert otthon tilos volt írni.","Mert minden lakásban volt külön dolgozószoba.","Mert a kávéház világos, fűtött és társas hely volt."],2],
["A kávéház működése","Melyik szolgáltatás illik a korabeli kávéházhoz?",["Újságolvasás és biliárd","Ingyenes wifi","Videójáték-konzol"],0],
["Főúr, rendelnék!","Fele tej, fele kávé: mit kér a vendég?",["Krahedli","Melanzs","Japán bomba"],1],
["Főúr, rendelnék!","Sonkát, szalámit és sajtot kér egy író.",["Írótál","Javító","Kapucíner"],0],
["Főúr, rendelnék!","Fagylaltos, tejberizses piskótadesszert?",["Bátori-pirítós","Melanzs","Japán bomba"],2],
["A szomszéd asztal","Mindig elköszön, mégsem távozik. Ki ő?",["Hordár","Felugrálós","Főúr"],1],
["A szomszéd asztal","Ki szállíthat üzenetet vörös sapkában?",["Hordár","Bohém","Stammgast"],0],
["A szomszéd asztal","Mindenhez ért, mindig neki van igaza. Ki ő?",["Pikoló","Főúr","Kávéházi Konrád"],2],
["Írók törzsasztala","A videó szerint ki kedvelte a lencsefőzeléket?",["Kosztolányi","Ady","Krúdy"],1],
["Írók törzsasztala","Kihez kapcsolódik a román kávé?",["Kosztolányi","Heltai","Krúdy"],0],
["Írók törzsasztala","Ki vitetett koporsókat a kávéház elé a videó anekdotája szerint?",["Ady","Kosztolányi","Krúdy"],2],
["Írók törzsasztala","Ki segíthetett hitellel vagy szerkesztői kapcsolattal egy kezdő írónak?",["A főpincér","A hordár","A zenész"],0],
["Időutazás 2026-ba","Hol található a New York Kávéház?",["Andrássy út 1.","Erzsébet körút 9–11.","Váci utca 10."],1],
["Időutazás 2026-ba","Mikor nyílt meg a New York?",["1848","1918","1894"],2],
["Időutazás 2026-ba","Melyik szálloda működik a palotában?",["Anantara New York Palace Budapest","Hotel Gellért","Hilton Budapest"],0],
["Időutazás 2026-ba","Melyik útvonal jó a Nyugatitól?",["M4 metró közvetlenül","4-es vagy 6-os villamos a Blaha Lujza térig, majd séta","HÉV Szentendréig"],1],
["Időutazó hibái","Az időutazó szerint a kávéházban tilos írni. Mi a javítás?",["Igaz, csak inni lehetett.","Csak a pincér írhatott.","Az írók dolgozhattak, papírt és tintát is kaphattak."],2],
["Időutazó hibái","A vendég szerint nem létezett hitelre fogyasztás. Mi a javítás?",["A főpincér egyes vendégeknek hitelt adhatott.","Csak bankkártyával fizettek.","Mindenki ingyen evett."],0]
];
const fresh=()=>({page:'home',section:0,visited:[],answers:{},done:false});
let state=fresh(),api=null,active=false;
function findAPI(w){for(let i=0;i<20&&w;i++){try{if(w.API)return w.API;if(w.parent===w)break;w=w.parent}catch(e){break}}return null}
try{api=findAPI(window)|| (window.opener&&findAPI(window.opener));if(api&&api.LMSInitialize('')==='true'){active=true;let d=api.LMSGetValue('cmi.suspend_data');if(d)state={...fresh(),...JSON.parse(d)};if(!state.done)api.LMSSetValue('cmi.core.lesson_status','incomplete');}}catch(e){}
if(!active){try{state={...fresh(),...JSON.parse(localStorage.getItem('kavehaz-v1')||'{}')}}catch(e){}}
const score=()=>questions.reduce((s,q,i)=>s+(state.answers[i]===q[3]?2:0),0);
function save(){try{if(active){api.LMSSetValue('cmi.suspend_data',JSON.stringify(state));api.LMSSetValue('cmi.core.score.min','0');api.LMSSetValue('cmi.core.score.max','40');api.LMSSetValue('cmi.core.score.raw',String(score()));api.LMSSetValue('cmi.core.lesson_status',state.done?'completed':'incomplete');api.LMSSetValue('cmi.core.exit','suspend');api.LMSCommit('')}else localStorage.setItem('kavehaz-v1',JSON.stringify(state))}catch(e){}}
window.addEventListener('pagehide',()=>{save();if(active){try{api.LMSFinish('')}catch(e){}active=false}});
function go(p,i){state.page=p;if(i!==undefined)state.section=i;if(p==='learn'&&!state.visited.includes(state.section))state.visited.push(state.section);save();render();window.scrollTo(0,0)}
function choose(i,j){if(state.done||Object.hasOwn(state.answers,i))return;state.answers[i]=j;save();render()}
function finish(){if(Object.keys(state.answers).length!==questions.length)return;state.done=true;save();render();window.scrollTo(0,0)}
function render(){const a=document.getElementById('app');if(state.page==='home'){a.innerHTML='<section class="panel"><h2>Üdv a kávéházban!</h2><p>Utazzatok vissza a századfordulós Budapestre! Először járjátok végig a négy állomást, nézzétek meg a két videót, és beszéljétek meg a kérdéseket. Ezután jöhet a 40 pontos próbatétel. Dolgozhattok együtt, de mindenki saját Moodle-fiókjában rögzítse a válaszait.</p><div class="menu">'+sections.map((s,i)=>'<button onclick="go(\'learn\','+i+')"><strong>'+s.icon+' '+s.title+'</strong>'+(state.visited.includes(i)?'Megnyitva ✓':'Felfedezés')+'</button>').join('')+'</div><p><button class="primary" onclick="go(\'quiz\')">Irány a próbatétel →</button></p></section>';return}
if(state.page==='learn'){let s=sections[state.section];a.innerHTML='<section class="panel"><small>Állomás '+(state.section+1)+' / 4</small><h2>'+s.icon+' '+s.title+'</h2><p>'+s.text+'</p>'+(s.video?'<iframe loading="lazy" title="'+s.title+'" src="https://www.youtube-nocookie.com/embed/'+s.video+'" allowfullscreen></iframe><p><a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+s.video+'">Videó megnyitása külön lapon</a></p>':'')+(s.words?'<div class="menu">'+s.words.map(w=>'<details><summary>'+w[0]+'</summary>'+w[1]+'</details>').join('')+'</div><p><a target="_blank" rel="noopener" href="https://archivum.pim.hu/puf/object.67c5f1a6-76fd-4829-9bd0-fd1b5efa0646.ivy.html">Teljes kávéházi szótár – PIM, Saly Noémi gyűjtése</a></p>':'')+(s.links?'<p>'+s.links.map(l=>'<a class="link" style="display:inline-block;margin:4px" target="_blank" rel="noopener" href="'+l[1]+'">'+l[0]+'</a>').join('')+'</p>':'')+'<div class="panel"><h3>Beszéljétek meg!</h3><p>'+s.task+'</p></div><button onclick="go(\'home\')">Állomások</button> <button class="primary" onclick="'+(state.section<3?'go(\'learn\','+(state.section+1)+')':'go(\'quiz\')')+'">'+(state.section<3?'Következő állomás →':'Próbatétel →')+'</button></section>';return}
let n=Object.keys(state.answers).length;let i=questions.findIndex((q,k)=>!Object.hasOwn(state.answers,k));if(state.done||i<0){a.innerHTML='<section class="panel"><h2>'+(state.done?'A próbatétel véget ért!':'Minden válasz rögzítve')+'</h2><h3>'+score()+' / 40 pont</h3>'+(state.done?'<p>Visszanézheted a válaszaidat. A pontszám már nem változik.</p>':'<p>Véglegesítsd a próbát!</p><button class="primary" onclick="finish()">Befejezés és mentés</button>')+'</section>'+questions.map((q,k)=>'<section class="panel"><strong>'+ (k+1)+'. '+q[1]+'</strong><p>Válaszod: '+q[2][state.answers[k]]+'</p><p class="'+(state.answers[k]===q[3]?'good':'bad')+'">Helyes: '+q[2][q[3]]+'</p></section>').join('');return}
let q=questions[i];a.innerHTML='<section class="panel"><small>'+q[0]+' · '+(i+1)+' / 20</small><progress max="20" value="'+n+'"></progress><p>'+score()+' / 40 pont · minden kérdés 2 pont</p><h2>'+q[1]+'</h2><p>Válassz egy megoldást! A válasz rögzítése végleges.</p><div class="choices">'+q[2].map((x,j)=>'<button onclick="choose('+i+','+j+')">'+x+'</button>').join('')+'</div><p><small>A teljes megoldáslista a végén jelenik meg. A kalauzhoz bármikor visszatérhetsz.</small></p></section>'}
render();
</script></html>
