.stationmap{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.stationmap button{min-height:120px;text-align:left;background:#f7e9d1;border:2px solid #a48050}.stationmap button strong{display:block;font-size:21px}.ticket{background:#eee0c3;border:2px dashed #a58050;padding:18px;border-radius:10px;margin:16px 0}.board{display:grid;gap:16px}.board article{border:1px solid #d6bd96;background:#fffdf8;padding:18px;border-radius:12px}.board select,.board input{font:inherit;width:100%;padding:10px;border:1px solid #98764c;border-radius:8px;background:white;color:#30251e}.board label{display:block;font-weight:600;margin-bottom:8px}.tiles{display:flex;flex-wrap:wrap;gap:8px}.tiles button[aria-pressed=true]{background:#6c472a;color:white}.muted{color:#6d5d4c}.seal{display:inline-block;padding:6px 12px;border:2px solid #89633b;border-radius:30px;font-weight:bold}.note{background:#f2e5cb;padding:14px;border-left:4px solid #9e7948;margin:16px 0}.guidebar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}.route{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.route span{padding:8px;border:1px solid #aa8a60;border-radius:8px}.receipt{border-top:2px dashed #bd9c70;border-bottom:2px dashed #bd9c70;padding:12px 0;margin:12px 0}.book{background:#f5e4c3;border:1px solid #b59462;padding:15px;border-radius:6px}a.link:focus{outline:3px solid #007c91}@media(max-width:520px){main{padding:12px}.panel{padding:18px}}

<header><div class="tag">Budapest · 1894 és a századforduló</div><h1>Irodalmi kávéház</h1><p>Kávéházi kalauz és pontszerző barangolás</p></header>
<main><nav><button onclick="go('home')">☕ Kezdőlap</button><a class="link" href="?guide=1" target="_blank" rel="noopener">📖 Kalauz új lapon ↗</a><button onclick="go('learn',0)">Kalauz itt</button><button onclick="go('quiz')">🎟 Próbatétel</button></nav><div id="app"></div></main><footer>Nyolcadikos irodalmi projekt · Források a kalauzban</footer>
<script>
const sections=[
{title:"A századforduló internete",icon:"📰",video:"bcO33l1lO0I",text:"A kávéház a hírek, találkozások és beszélgetések helye volt. A századforduló Budapestjén több száz működött. Újságok, biliárd, kártya és egyes helyeken élőzene várta a vendégeket. Sok embernek a szűkös, kényelmetlen lakás helyett a fűtött, világos kávéház adott munkahelyet. Az írók jelenléte a tulajdonosnak is megérte: híres vendégeik másokat vonzottak. Egyes helyek éjjel-nappal nyitva tartottak.",task:"Beszéljétek meg: miért nevezhető a kávéház a kor internetének? Gyűjtsetek három okot, amiért valaki egész nap ott maradhatott."},
{title:"Írók és főpincérek",icon:"✒️",video:"uijRnHp6FVo",text:"A New York Kávéház 1894-ben nyílt meg a New York biztosítótársaság palotájában. Heltai Jenő, Ady Endre, Kosztolányi Dezső és Krúdy Gyula neve is kapcsolódik a kávéházi világhoz. Az írók papírt és tintát kaphattak; a főpincér hitelt adhatott és szerkesztőkkel is összeismertethette őket. A videó szerint Ady lencsefőzeléket kedvelt, Kosztolányi román kávét (kávé, rum, kenyérbél). A Krúdy-anekdotában az író koporsókat vitetett a kávéház elé, hogy barátja reggelit kapjon.",task:"Miért volt a főpincér több egyszerű kiszolgálónál? Meséljétek el egymásnak a Krúdy-anekdotát."},
{title:"Beszélsz kávéháziul?",icon:"🍰",text:"A korabeli kávéházi nyelv tele volt különös szavakkal. Ismerjétek meg a szótár válogatását, majd próbáljatok egymásnak korabeli rendelést feladni!",task:"Egyikőtök legyen a pincér, másikótok a vendég. Rendeljetek ételt és italt, majd cseréljetek szerepet.",words:[["Írótál","Sonka, szalámi, sajt; a New York specialitása."],["Melanzs","Fele tej, fele kávé."],["Japán bomba","Fagylalttal és tejberizzsel töltött piskótadesszert."],["Krahedli","Szénsavas üdítő."],["Kapucíner","Sötétre pörkölt kávé tejszínhabbal, kakaóval."],["Bátori-pirítós","Pirítós sült szalonnával és fokhagymával."],["Javító","Kis ingyenes kiegészítő, például tej vagy cukor."],["Főúr","Főpincér."],["Pikoló","Pincérfiú; italnévként kis feketekávé is."],["Felugrálós","Mindig indul, mégsem megy el."],["Bohém","Kötetlen életű művész vagy fiatal."],["Hordár","Poggyászt, üzenetet szállító, vörös sapkás küldönc."],["Stammgast","Törzsvendég."],["Kávéházi Konrád","Fontoskodó mindentudó."],["Csúzlicédula","A főpincér adósainak jegyzéke."],["Kutyanyelv","Jegyzeteléshez adott blokkpapír."],["Nyehó","A New York beceneve."],["Mélyvíz","A New York mélyített alsó szintje."],["Veseasztal","A kritikusok törzshelye."],["Macherlón","Borravaló."],["Ez nekem nem kávéház","Nem érdekel."]]},
{title:"A New York akkor és most",icon:"🏛️",text:"A palota ma is áll a VII. kerületben, az Erzsébet körút 9–11. alatt. A kávéház a földszinten található; az épületben az Anantara New York Palace Budapest szálloda működik. A Blaha Lujza tér közelében járunk. Nézzétek meg a palota díszes homlokzatát és belső tereit a hivatalos honlapon, majd tervezzetek utat a Nyugati pályaudvartól!",task:"Keressétek meg a címet, a szálloda nevét és a közeli villamosokat. Nézzétek meg az épület fotóit: milyen részletek árulkodnak a palota eleganciájáról?",links:[["Hivatalos honlap","https://newyorkcafe.hu/"],["Történet és építészet","https://newyorkcafe.hu/kavehaz/"],["Szálloda","https://www.anantara.com/en/new-york-palace-budapest"],["Térkép és útvonal","https://www.google.com/maps/search/?api=1&query=New+York+Cafe+Budapest"]]}
];
const questions=[
["A kávéház működése","Miért nevezzük a kávéházat a kor internetének?",["Mert híreket, újságokat és beszélgetőtársakat találtak ott.","Mert számítógépek működtek benne.","Mert csak táviratokat továbbítottak."],0],
["A kávéház működése","Miért vonzották a tulajdonosok a híres írókat?",["Hogy bezárhassanak korábban.","Mert más vendégeket is odavonzottak.","Mert az írók fizették az összes számlát."],1],
["A kávéház működése","Miért dolgoztak sokan a kávéházban?",["Mert otthon tilos volt írni.","Mert minden lakásban volt külön dolgozószoba.","Mert a kávéház világos, fűtött és társas hely volt."],2],
["A kávéház működése","Melyik szolgáltatás illik a korabeli kávéházhoz?",["Újságolvasás és biliárd","Ingyenes wifi","Videójáték-konzol"],0],
["Főúr, rendelnék!","Fele tej, fele kávé: mit kér a vendég?",["Krahedli","Melanzs","Japán bomba"],1],
["Főúr, rendelnék!","Sonkát, szalámit és sajtot kér egy író.",["Írótál","Javító","Kapucíner"],0],
["Főúr, rendelnék!","Fagylaltos, tejberizses piskótadesszert?",["Bátori-pirítós","Melanzs","Japán bomba"],2],
["A szomszéd asztal","Mindig elköszön, mégsem távozik. Ki ő?",["Hordár","Felugrálós","Főúr"],1],
["A szomszéd asztal","Ki szállíthat üzenetet vörös sapkában?",["Hordár","Bohém","Stammgast"],0],
["A szomszéd asztal","Mindenhez ért, mindig neki van igaza. Ki ő?",["Pikoló","Főúr","Kávéházi Konrád"],2],
["Írók törzsasztala","A videó szerint ki kedvelte a lencsefőzeléket?",["Kosztolányi","Ady","Krúdy"],1],
["Írók törzsasztala","Kihez kapcsolódik a román kávé?",["Kosztolányi","Heltai","Krúdy"],0],
["Írók törzsasztala","Ki vitetett koporsókat a kávéház elé a videó anekdotája szerint?",["Ady","Kosztolányi","Krúdy"],2],
["Írók törzsasztala","Ki segíthetett hitellel vagy szerkesztői kapcsolattal egy kezdő írónak?",["A főpincér","A hordár","A zenész"],0],
["Időutazás 2026-ba","Hol található a New York Kávéház?",["Andrássy út 1.","Erzsébet körút 9–11.","Váci utca 10."],1],
["Időutazás 2026-ba","Mikor nyílt meg a New York?",["1848","1918","1894"],2],
["Időutazás 2026-ba","Melyik szálloda működik a palotában?",["Anantara New York Palace Budapest","Hotel Gellért","Hilton Budapest"],0],
["Időutazás 2026-ba","Melyik útvonal jó a Nyugatitól?",["M4 metró közvetlenül","4-es vagy 6-os villamos a Blaha Lujza térig, majd séta","HÉV Szentendréig"],1],
["Időutazó hibái","Az időutazó szerint a kávéházban tilos írni. Mi a javítás?",["Igaz, csak inni lehetett.","Csak a pincér írhatott.","Az írók dolgozhattak, papírt és tintát is kaphattak."],2],
["Időutazó hibái","A vendég szerint nem létezett hitelre fogyasztás. Mi a javítás?",["A főpincér egyes vendégeknek hitelt adhatott.","Csak bankkártyával fizettek.","Mindenki ingyen evett."],0]
];
const guideOnly=new URLSearchParams(location.search).has('guide');
const fresh=()=>({page:'home',section:0,visited:[],answers:{},done:false});
let state=fresh(),api=null,active=false;
function findAPI(w){for(let i=0;i<20&&w;i++){try{if(w.API)return w.API;if(w.parent===w)break;w=w.parent}catch(e){break}}return null}
try{if(!guideOnly)api=findAPI(window)|| (window.opener&&findAPI(window.opener));if(api&&api.LMSInitialize('')==='true'){active=true;let d=api.LMSGetValue('cmi.suspend_data');if(d)state={...fresh(),...JSON.parse(d)};if(!state.done)api.LMSSetValue('cmi.core.lesson_status','incomplete');}}catch(e){}
if(!active&&!guideOnly){try{state={...fresh(),...JSON.parse(localStorage.getItem('kavehaz-v2')||'{}')}}catch(e){}}
if(guideOnly){state.page='learn';state.section=0;document.querySelector('nav').innerHTML='<span class="seal">📖 Önálló kalauz · pontozás nélkül</span> '+sections.map((x,i)=>'<button onclick="go(\'learn\','+i+')">'+x.icon+' '+(i+1)+'</button>').join('');}
const score=()=>questions.reduce((s,q,i)=>s+(state.answers[i]===q[3]?2:0),0);
function save(){if(guideOnly)return;try{if(active){api.LMSSetValue('cmi.suspend_data',JSON.stringify(state));api.LMSSetValue('cmi.core.score.min','0');api.LMSSetValue('cmi.core.score.max','40');api.LMSSetValue('cmi.core.score.raw',String(state.done?score():0));api.LMSSetValue('cmi.core.lesson_status',state.done?'completed':'incomplete');api.LMSSetValue('cmi.core.exit','suspend');api.LMSCommit('')}else localStorage.setItem('kavehaz-v2',JSON.stringify(state))}catch(e){}}
window.addEventListener('pagehide',()=>{save();if(active){try{api.LMSFinish('')}catch(e){}active=false}});
function go(p,i){if(guideOnly){p='learn';if(i===undefined)i=0;}state.page=p;if(i!==undefined)state.section=i;if(p==='learn'&&!state.visited.includes(state.section))state.visited.push(state.section);save();render();window.scrollTo(0,0)}
function choose(i,j){if(state.done||guideOnly)return;if(j===''||j===null)delete state.answers[i];else state.answers[i]=Number(j);if(state.extra)delete state.extra[i];save();render()}
function finish(){if(state.done||Object.keys(state.answers).length!==questions.length)return;state.done=true;save();render();window.scrollTo(0,0)}
const rooms=[
{title:'Az előcsarnok',icon:'🚪',ids:[0,1,2,3],type:'evidence',story:'A főúr négy bizonyítékot kér arról, hogy ismeritek a kávéház világát. Válogassátok ki a hiteles magyarázatokat!',hint:'Az első videó és a kalauz első állomása segít.'},
{title:'A rendelőpult',icon:'☕',ids:[4,5,6],type:'order',story:'Három rendelés érkezett. Állítsátok össze a pincér tálcáját! A harmadik rendelés a Japán Kávéházból érkezett képzeletbeli üzenet.',hint:'A kávéházi szótárban keressétek a fogásokat.'},
{title:'A vendégtér',icon:'🎩',ids:[7,8,9],type:'match',story:'A főúr elvesztette az asztalrendjét. Tegyétek a megfelelő névkártyát minden vendég leírásához!',hint:'A kávéházi figurák segítenek.'},
{title:'A törzsasztal',icon:'✒️',ids:[10,11,12,13],type:'match',story:'Négy feljegyzés maradt a szerkesztő asztalán. Azonosítsátok, kihez tartoznak!',hint:'A második videóban találjátok a nyomokat.'},
{title:'A város kapuja',icon:'🏛️',ids:[14,15,16,17],type:'city',story:'Az időgéphez be kell állítani a New York adatait. Keressétek meg a címet, az évszámot, a szállodát és a mai útvonalat!',hint:'Használjátok a kalauz negyedik állomását és a térképet.'},
{title:'A szerkesztőség',icon:'🗞️',ids:[18,19],type:'evidence',story:'Két téves állítás került egy újságcikkbe. Javítsátok ki őket, mielőtt nyomdába kerülnek!',hint:'Az írók és a főpincérek állomása segít.'}
];
let currentRoom=-1,review=false;
function room(i){currentRoom=i;review=false;state.page='quiz';save();render();window.scrollTo(0,0)}
function overview(){currentRoom=-1;review=true;state.page='quiz';render();window.scrollTo(0,0)}
function tile(i,j){choose(i,j)}
function selectMarkup(i){let q=questions[i];return '<select aria-label="'+q[1]+'" '+(state.done?'disabled':'')+' onchange="choose('+i+',this.value)"><option value="">Válassz…</option>'+q[2].map((x,j)=>'<option value="'+j+'" '+(state.answers[i]===j?'selected':'')+'>'+x+'</option>').join('')+'</select>'}
function answerCard(i,type){let q=questions[i];let v=state.answers[i];let control=(type==='match'||type==='city')?selectMarkup(i):'<div class="tiles">'+q[2].map((x,j)=>'<button aria-pressed="'+(v===j)+'" '+(state.done?'disabled':'')+' onclick="tile('+i+','+j+')">'+x+'</button>').join('')+'</div>';return '<article><label>'+q[1]+'</label>'+control+(v===-1?'<p>Korábbi válasz: '+esc(shown(i))+'</p>':'')+'</article>'}

let selectedMenu=null, selectedPerson=null;
const menuItems=['Melanzs','Írótál','Japán bomba','Krahedli','Kapucíner','Bátori-pirítós','Javító'];
const personItems=['Felugrálós','Hordár','Kávéházi Konrád','Bohém','Főúr','Stammgast'];
function pickMenu(j){selectedMenu=j;render()}
function placeMenu(i){if(selectedMenu===null)return;let j=questions[i][2].indexOf(menuItems[selectedMenu]);if(j<0){ // all menu items can be placed; retain an incorrect response as -1
state.answers[i]=-1;state.extra=state.extra||{};state.extra[i]=menuItems[selectedMenu];save();render();}else{if(state.extra)delete state.extra[i];choose(i,j)}}
function pickPerson(j){selectedPerson=j;render()}
function placePerson(i){if(selectedPerson===null)return;let j=questions[i][2].indexOf(personItems[selectedPerson]);if(j<0){state.answers[i]=-1;state.extra=state.extra||{};state.extra[i]=personItems[selectedPerson];save();render()}else{if(state.extra)delete state.extra[i];choose(i,j)}}
function shown(i){return state.answers[i]===-1?(state.extra&&state.extra[i]||'Egyéb válasz'):(questions[i][2][state.answers[i]]||'Még üres')}
function pool(items,selected,fn){return '<div class="tiles">'+items.map((x,j)=>'<button aria-pressed="'+(j===selected)+'" onclick="'+fn+'('+j+')">'+x+'</button>').join('')+'</div>'}
function placement(ids,fn){return '<div class="board">'+ids.map(i=>'<article><label>'+questions[i][1]+'</label><div class="receipt">Elhelyezve: <strong>'+shown(i)+'</strong></div><button onclick="'+fn+'('+i+')">Kiválasztott kártya ide</button></article>').join('')+'</div>'}
function exact(i,val){let t=val.trim().toLowerCase();let j=questions[i][2].findIndex(x=>x.toLowerCase()===t);if(i===14&&/erzsébet\s+körút\s*9\s*[-–]\s*11\.?$/i.test(t))j=1;if(!t){choose(i,'');return}if(j<0){state.answers[i]=-1;state.extra=state.extra||{};state.extra[i]=val.trim().slice(0,100);save();render()}else{if(state.extra)delete state.extra[i];choose(i,j)}}
function cityBoard(){return '<div class="book"><h3>Időgép – célállomás</h3><p>Állítsátok be a koordinátákat a források alapján!</p><div class="board">'+[14,15].map(i=>'<article><label for="field'+i+'">'+questions[i][1]+'</label><input id="field'+i+'" '+(i===15?'inputmode="numeric" maxlength="4"':'maxlength="100"')+' value="'+(Object.hasOwn(state.answers,i)?esc(shown(i)):'')+'" placeholder="'+(i===15?'Évszám':'Utca és házszám')+'"><button onclick="exact('+i+',document.getElementById(\'field'+i+'\').value)">Rögzítés</button></article>').join('')+answerCard(16,'city')+'<article><label>Válasszátok ki az útvonalat!</label><div class="route"><span>🚉 Nyugati pályaudvar</span><span>→</span><span>?</span><span>→</span><span>☕ New York</span></div>'+selectMarkup(17)+'</article></div></div>'}
function esc(x){return String(x).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')}

function game(){let a=document.getElementById('app'),n=Object.keys(state.answers).length;
const guide='<a class="link" href="?guide=1" target="_blank" rel="noopener">📖 Kalauz külön lapon ↗</a>';
if(state.done){a.innerHTML='<section class="panel"><h2>🎉 A küldetés lezárult!</h2><h3>'+score()+' / 40 pont</h3><p>Most már ismeritek a kávéház világát. A pontszám végleges.</p>'+guide+'</section>'+questions.map((q,i)=>'<section class="panel"><strong>'+(i+1)+'. '+q[1]+'</strong><p>Válaszod: '+esc(shown(i))+'</p><p class="'+(state.answers[i]===q[3]?'good':'bad')+'">Helyes: '+q[2][q[3]]+'</p></section>').join('');return}
if(review){a.innerHTML='<section class="panel"><h2>🧾 A főúr ellenőrző könyve</h2><p>Véglegesítés előtt minden válasz módosítható. A helyes megoldásokat csak beadás után mutatjuk meg.</p><div class="guidebar">'+guide+'<button onclick="room(-1)">Vissza a térképre</button></div><p>'+n+' / 20 válasz rögzítve.</p><button class="primary" '+(n!==20?'disabled':'')+' onclick="if(confirm(\'Biztosan véglegesíted a 40 pontos próbatételt?\'))finish()">Véglegesítés és beadás</button></section><div class="board">'+questions.map((q,i)=>answerCard(i,'match')).join('')+'</div>';return}
if(currentRoom<0){a.innerHTML='<section class="panel"><h2>🗝️ A főúr hat pecsétje</h2><p>Éppen bezárni készül a képzeletbeli kávéház titkos szerkesztősége. A főúr hat helyszínen vár titeket: gyűjtsetek hat pecsétet, hogy átadhassátok a szerkesztőnek az üzenetet! A helyszínek tetszőleges sorrendben látogathatók.</p><div class="note"><strong>Felkészültetek?</strong> A küldetés előtt nézzétek meg mindkét videót a Kalauzban, ismerkedjetek meg a szótárral és a mai New York Kávéházzal. A Kalauzt a küldetés alatt is használhatjátok, és közösen kereshetitek a megoldásokat.</div><div class="guidebar">'+guide+'<button onclick="overview()">🧾 Válaszok áttekintése</button></div><progress value="'+n+'" max="20"></progress><p>'+n+' / 20 válasz · 40 pont szerezhető. A pecsét a kitöltést jelzi, nem a helyességet.</p><div class="stationmap">'+rooms.map((r,i)=>{let k=r.ids.filter(j=>Object.hasOwn(state.answers,j)).length;return '<button onclick="room('+i+')"><strong>'+r.icon+' '+r.title+'</strong>'+k+' / '+r.ids.length+' nyom '+(k===r.ids.length?' · ✔ Pecsét megszerezve':'')+'</button>'}).join('')+'</div></section>';return}
let r=rooms[currentRoom];let count=r.ids.filter(i=>Object.hasOwn(state.answers,i)).length;
let content=r.ids.map(i=>answerCard(i,r.type)).join('');
if(r.type==='order')content='<div class="book"><h3>Étlap – válasszatok egy fogást!</h3>'+pool(menuItems,selectedMenu,'pickMenu')+'<p>Ezután kattintsatok arra a rendelési cédulára, amelyikhez illik.</p>'+placement(r.ids,'placeMenu')+'</div>';
else if(currentRoom===2)content='<div class="book"><h3>Vendégek névkártyái</h3>'+pool(personItems,selectedPerson,'pickPerson')+'<p>Válasszatok névkártyát, majd helyezzétek a megfelelő vendéghez.</p>'+placement(r.ids,'placePerson')+'</div>';
else if(r.type==='city')content=cityBoard();
else if(r.type==='match')content='<div class="book"><h3>Asztalrend / feljegyzések</h3><div class="board">'+content+'</div></div>';
else content='<div class="board">'+content+'</div>';
a.innerHTML='<section class="panel"><small>'+r.icon+' '+(currentRoom+1)+' / 6 helyszín</small><h2>'+r.title+'</h2><p>'+r.story+'</p><div class="note">'+r.hint+' · '+guide+'</div>'+content+'<div class="ticket"><strong>'+count+' / '+r.ids.length+' nyom rögzítve</strong> '+(count===r.ids.length?' · ✔ Pecsét megszerezve':'')+'<p>A válaszok módosíthatók a beadásig.</p><button onclick="room(-1)">← Kávéház térképe</button> <button class="primary" onclick="overview()">Ellenőrző könyv →</button></div></section>';
}
function resetDemo(){if(active||guideOnly)return;if(!confirm('Új próba indítása? A böngészőben mentett eddigi válaszok törlődnek.'))return;state=fresh();currentRoom=-1;review=false;selectedMenu=null;selectedPerson=null;save();render();window.scrollTo(0,0)}
function render(){if(!active&&!api&&!guideOnly&&!document.getElementById('resetDemo')){let b=document.createElement('button');b.id='resetDemo';b.textContent='↻ Új játék (kipróbálás)';b.onclick=resetDemo;document.querySelector('nav').appendChild(b)}if(state.page==='quiz'&&!guideOnly){game();return}const a=document.getElementById('app');if(state.page==='home'){a.innerHTML='<section class="panel"><h2>Üdv a kávéházban!</h2><p>Utazzatok vissza a századfordulós Budapestre! Először járjátok végig a négy tanulóállomást. <strong>Mindkét videót nézzétek meg teljes egészében!</strong> A hat pecsét megszerzéséhez szükségetek lesz a videókban elhangzó információkra, a kávéházi szótárra és a mai New York Kávéház adataira. Beszéljétek meg az állomások kérdéseit, majd kezdjétek el a 40 pontos küldetést. A kalauzt közben is szabad használni. Dolgozhattok együtt, de mindenki saját Moodle-fiókjában rögzítse a válaszait.</p><div class="menu">'+sections.map((s,i)=>'<button onclick="go(\'learn\','+i+')"><strong>'+s.icon+' '+s.title+'</strong>'+(state.visited.includes(i)?'Megnyitva ✓':'Felfedezés')+'</button>').join('')+'</div><p><button class="primary" onclick="go(\'quiz\')">Irány a próbatétel →</button></p></section>';return}
if(state.page==='learn'){let s=sections[state.section];a.innerHTML='<section class="panel"><small>Állomás '+(state.section+1)+' / 4</small><h2>'+s.icon+' '+s.title+'</h2><p>'+s.text+'</p>'+(s.video?'<p><strong>Videó: '+(state.section===0?'kb. 4 perc':'kb. 5 perc')+'</strong> <small>(becslés)</small></p><div class="note"><strong>Kötelező küldetés-előkészület:</strong> Nézzétek meg a teljes videót! Figyeljétek a részleteket, mert a pecsétekhez tartozó feladatokban szükségetek lesz rájuk. A videót később is visszanézhetitek.</div>':'')+(s.video?'<iframe loading="lazy" title="'+s.title+'" src="https://www.youtube-nocookie.com/embed/'+s.video+'" allowfullscreen></iframe><p><a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v='+s.video+'">Videó megnyitása külön lapon</a></p>':'')+(s.words?'<div class="menu">'+s.words.map(w=>'<details><summary>'+w[0]+'</summary>'+w[1]+'</details>').join('')+'</div><p><a target="_blank" rel="noopener" href="https://archivum.pim.hu/puf/object.67c5f1a6-76fd-4829-9bd0-fd1b5efa0646.ivy.html">Teljes kávéházi szótár – PIM, Saly Noémi gyűjtése</a></p>':'')+(s.links?'<p>'+s.links.map(l=>'<a class="link" style="display:inline-block;margin:4px" target="_blank" rel="noopener" href="'+l[1]+'">'+l[0]+'</a>').join('')+'</p>':'')+'<div class="panel"><h3>Beszéljétek meg!</h3><p>'+s.task+'</p></div><button onclick="go(\'home\')">Állomások</button> <button class="primary" onclick="'+(state.section<3?'go(\'learn\','+(state.section+1)+')':guideOnly?'go(\'learn\',0)':'go(\'quiz\')')+'">'+(state.section<3?'Következő állomás →':guideOnly?'Vissza az első állomásra':'Próbatétel →')+'</button></section>';return}
let n=Object.keys(state.answers).length;let i=questions.findIndex((q,k)=>!Object.hasOwn(state.answers,k));if(state.done||i<0){a.innerHTML='<section class="panel"><h2>'+(state.done?'A próbatétel véget ért!':'Minden válasz rögzítve')+'</h2><h3>'+score()+' / 40 pont</h3>'+(state.done?'<p>Visszanézheted a válaszaidat. A pontszám már nem változik.</p>':'<p>Véglegesítsd a próbát!</p><button class="primary" onclick="finish()">Befejezés és mentés</button>')+'</section>'+questions.map((q,k)=>'<section class="panel"><strong>'+ (k+1)+'. '+q[1]+'</strong><p>Válaszod: '+q[2][state.answers[k]]+'</p><p class="'+(state.answers[k]===q[3]?'good':'bad')+'">Helyes: '+q[2][q[3]]+'</p></section>').join('');return}
let q=questions[i];a.innerHTML='<section class="panel"><small>'+q[0]+' · '+(i+1)+' / 20</small><progress max="20" value="'+n+'"></progress><p>'+score()+' / 40 pont · minden kérdés 2 pont</p><h2>'+q[1]+'</h2><p>Válassz egy megoldást! A válasz rögzítése végleges.</p><div class="choices">'+q[2].map((x,j)=>'<button onclick="choose('+i+','+j+')">'+x+'</button>').join('')+'</div><p><small>A teljes megoldáslista a végén jelenik meg. A kalauzhoz bármikor visszatérhetsz.</small></p></section>'}
render();
</script></html>
