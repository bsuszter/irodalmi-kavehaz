let state=fresh(),api=null,active=false,selected=null,viewItem=-1,notice='',review=false;
function findAPI(w){for(let i=0;i<20&&w;i++){try{if(w.API)return w.API;if(w.parent===w)break;w=w.parent}catch(e){break}}return null}
try{if(!guideOnly){api=findAPI(window)||(window.opener&&findAPI(window.opener));if(api&&api.LMSInitialize('')==='true'){active=true;let d=api.LMSGetValue('cmi.suspend_data');if(d){let p=JSON.parse(d);if(p.v===VERSION)state={...fresh(),...p};else if(p.done){state={...fresh(),...p,legacy:true};}}}}}catch(e){}
if(!active&&!api&&!guideOnly){try{let p=JSON.parse(localStorage.getItem(KEY)||'null');if(p&&p.v===VERSION)state={...fresh(),...p};else if(!p){let old=JSON.parse(localStorage.getItem('kavehaz-v5')||'null');if(old&&!old.done){state={...fresh(),...old,v:VERSION,recipes:{4:[],6:[]},code:false,page:'review',items:old.items.filter(i=>i!==5)};[4,6,17].forEach(i=>{delete state.answers[i];delete state.extra[i]});state.actions.route=false;state.route=[];}}}catch(e){}}
const score=()=>questions.reduce((n,q,i)=>n+(state.answers[i]===q[3]?2:0),0);

window.addEventListener('pagehide',()=>{save();if(active){try{api.LMSFinish('')}catch(e){}active=false}});

function go(p,i){if(guideOnly)p='learn';state.page=p;if(i!==undefined)state.section=i;if(p==='learn'&&!state.visited.includes(state.section))state.visited.push(state.section);review=false;viewItem=-1;save();render();window.scrollTo(0,0)}
function openRoom(i){if(i>state.items.length||i<0||i>5)return;state.page='room';state.room=i;selected=null;dishSelected=null;viewItem=-1;notice='';save();render();window.scrollTo(0,0)}
function setAnswer(i,v,extra){if(state.done)return;if(v===null){delete state.answers[i];delete state.extra[i]}else{state.answers[i]=v;if(extra!==undefined)state.extra[i]=extra;else delete state.extra[i]}save();render()}
function pick(v){selected=v;render()}
function place(i){if(selected===null)return;let j=questions[i][2].indexOf(selected);setAnswer(i,j,j<0?selected:undefined)}
function shown(i){if([4,5,6,17].includes(i)&&Object.hasOwn(state.answers,i)&&state.extra[i])return state.extra[5];return state.answers[i]===-1?(state.extra[i]||'Egyéb válasz'):(questions[i][2][state.answers[i]]||'Még nincs válasz')}
function inputAnswer(i){let el=document.getElementById('field'+i),v=el.value.trim();if(!v){setAnswer(i,null);return}let norm=v.toLowerCase().replace(/\s+/g,' ').replace(/[–—]/g,'-').replace(/\.$/,'');let j=questions[i][2].findIndex(x=>x.toLowerCase().replace(/[–—]/g,'-').replace(/\.$/,'')===norm);if(i===14&&/^(?:1073\s*)?(?:budapest,?\s*)?erzsébet\s+körút\s*9\s*-\s*11$/i.test(norm))j=1;setAnswer(i,j,j<0?v.slice(0,100):undefined)}

"routeCheck()" '+(state.route.length!==4?'disabled':'')+'>Útvonal rögzítése</button>'+(state.actions.route?'<p class="good">✓ Útvonal rögzítve. Beadásig módosítható.</p>':'')+'</div>'}

const facadeNotes=['Egy egész épületet mutató felvétel: ebből ismerhető fel a palota az utcán.','Szárnyas, bronzból készült alakok tartják az esti járókelőket megvilágító lámpásokat.','A bejárat mellett emberalakú kőszobrok úgy állnak, mintha az épület súlyát viselnék.'];

function shuffled(arr,key){let n=(state.seed||1)^([...String(key)].reduce((a,c)=>Math.imul(a,31)+c.charCodeAt(0)|0,0));let out=arr.slice();for(let i=out.length-1;i>0;i--){n=(Math.imul(n,1664525)+1013904223)>>>0;let j=n%(i+1);[out[i],out[j]]=[out[j],out[i]]}return out}

function foodPlate(){return '<div class="paper"><h3>🍽️ A konyha – készítsétek el az írótálat!</h3><p>Egy író az eredeti New York-i kis irodalmit kéri. Válasszatok három hozzávalót, és állítsátok össze a tálat. A tálca elemeire kattintva visszavehetitek őket.</p><div class="foodgrid">'+shuffled([0,1,2,3,4,5],'ingredients').map(i=>'<button class="foodtile" aria-pressed="'+state.ingredients.includes(i)+'" onclick="toggleIngredient('+i+')"><span>'+ingredients[i][1]+'</span>'+ingredients[i][0]+'</button>').join('')+'</div><div class="plate" aria-label="Írótál">'+(state.ingredients.length?state.ingredients.map(i=>'<button title="Levétel: '+ingredients[i][0]+'" onclick="toggleIngredient('+i+')"><span>'+ingredients[i][1]+'</span>'+ingredients[i][0]+'</button>').join(''):'<span class="muted">Üres tányér</span>')+'</div><button class="primary" onclick="plateSave()" '+(state.ingredients.length!==3?'disabled':'')+'>Tálalás rögzítése</button>'+(Object.hasOwn(state.answers,5)?'<p>✓ A tálalás rögzítve.</p>':'')+'</div>'}

function serving(){return '<div class="paper"><h3>☕ Kiszolgálás a törzsasztalnál</h3><p>Válasszatok egy rendelést, majd kattintsatok arra az íróra, akihez a videó története alapján tartozik. A reggeli Krúdy esetében a barátjának szól.</p><div class="foodgrid">'+shuffled([0,1,2],'dishes').map(i=>'<button class="foodtile" aria-pressed="'+(dishSelected===i)+'" onclick="pickDish('+i+')"><span>'+dishes[i][1]+'</span>'+dishes[i][0]+'</button>').join('')+'</div><div class="writers">'+shuffled([0,1,2],'writers').map(w=>{let x=writers[w];let file=encodeURIComponent(x.file);return '<article><button class="portrait" onclick="serve('+w+')" '+(dishSelected===null?'disabled':'')+'><img loading="lazy" referrerpolicy="no-referrer" src="https://commons.wikimedia.org/wiki/Special:FilePath/'+file+'?width=250" alt="'+x.name+'"><strong>'+x.name+'</strong><span>Rendelés ide</span></button><div class="served">'+dishes.filter(d=>shown(d[2])===x.value||shown(d[2])===x.name).map(d=>'<p>'+d[1]+' '+d[0]+'</p>').join('')+'</div><small><a href="https://commons.wikimedia.org/wiki/File:'+file+'" target="_blank" rel="noopener">'+x.credit+'</a></small></article>'}).join('')+'</div><p class="muted">'+dishes.filter(d=>Object.hasOwn(state.answers,d[2])).length+' / 3 rendelés elhelyezve. A fogásokat újra kijelölve módosíthatjátok a címzettet.</p></div>'}


const recipeData={4:{name:'Melanzs',icon:'☕',items:[['Kávé','☕'],['Tej','🥛'],['Rum','🍶'],['Kakaó','🍫'],['Tejszínhab','🍦']],correct:[0,1]},6:{name:'Japán bomba',icon:'🍨',items:[['Piskóta','🍰'],['Fagylalt','🍨'],['Tejberizs','🍚'],['Tejszínhab','🍦'],['Szalámi','🍖'],['Fokhagyma','🧄']],correct:[0,1,2,3]}};
function recipeToggle(i,j){if(state.done)return;let a=state.recipes[i]||[];if(a.includes(j))state.recipes[i]=a.filter(k=>k!==j);else if(a.length<recipeData[i].correct.length)state.recipes[i]=[...a,j];delete state.answers[i];delete state.extra[i];save();render()}

function roomPage(){let i=state.room,r=rooms[i],n=r.ids.filter(j=>Object.hasOwn(state.answers,j)).length;let locked=i===5&&!state.code;let needs=false;return '<section class="panel"><div class="roomhead"><div class="symbol">'+r.icon+'</div><div><div class="eyebrow">Helyszín '+(i+1)+' / 6</div><h2>'+r.title+'</h2></div></div><div class="dialogue"><p><strong>'+r.speaker+':</strong></p><p>'+r.line+'</p></div>'+(needs?gate(i):locked?'<div class="paper"><h3>🔒 A szerkesztő fiókja</h3><p>A szerkesztő levelében van a jelszóhoz vezető nyom. Olvassátok el, és keressetek a kalauz szótárában!</p><label for="code">Kód</label><input id="code" maxlength="20" autocomplete="off"><button class="primary" onclick="checkCode()">Zár kinyitása</button></div>':roomContent(i)+extraPuzzle(i)+'<div class="ticket"><strong>'+n+' / '+r.ids.length+' válasz rögzítve</strong><p>A nyom átvételéhez rögzítsétek a válaszokat és oldjátok meg a helyszíni rejtvényt, ha van. A pontozott válaszok a beadásig módosíthatók.</p><button class="primary" onclick="collect()" '+(n!==r.ids.length||!extraReady(i)?'disabled':'')+'>'+(state.items.includes(i)?'Nyom megtekintése':'Nyom átvétele →')+'</button></div>')+(notice?'<p class="notice" role="status">'+esc(notice)+'</p>':'')+(state.items.includes(i)?'<div class="clue"><span class="stamp">MEGTALÁLVA</span><h3>'+r.glyph+' '+r.item+'</h3><p>'+r.clue+'</p>'+(i<5?'<button class="primary" onclick="openRoom('+(i+1)+')">Következő helyszín →</button>':'<button class="primary" onclick="overview()">Ellenőrző könyv →</button>')+'</div>':'')+'<div class="toolbar"><button onclick="go(\'map\')">← Térkép</button>'+guideLink+'<button onclick="overview()">Áttekintés</button></div></section>'}
function reviewPage(){completeFinal();return '<section class="panel"><h2>🧾 Ellenőrző könyv</h2><p>A válaszokat a véglegesítésig szabadon módosíthatjátok. A megoldásokat csak beadás után mutatjuk meg. Kattintsatok a helyszínre a javításhoz.</p>'+(ready()?'<div class="notice">✓ Minden feladat kész. Beadhatjátok a küldetést.</div>':'<div class="notice"><strong>A beadáshoz még hiányzik:</strong>'+missing().map(x=>'<p>'+x.title+': '+(x.n?x.n+' rögzítetlen válasz. ':'')+(x.extra?(x.i===0?'A főúr asztalán még meg kell találni az üzenetet.':x.i===4?'Az útvonalat még rögzíteni kell.':'A szerkesztő fiókját még ki kell nyitni.'):'')+'</p>').join('')+'</div>')+''+rooms.map((r,i)=>'<div class="reviewline"><h3>'+r.icon+' '+r.title+'</h3>'+r.ids.map(j=>'<p><strong>'+([4,5,6].includes(j)?({4:'Melanzs',5:'Írótál',6:'Japán bomba'}[j]+' – hozzávalók'):questions[j][1])+'</strong><br>'+esc(shown(j))+'</p>').join('')+'<button onclick="openRoom('+i+')" '+(i>state.items.length?'disabled':'')+'>Válaszok módosítása</button></div>').join('')+'<div class="toolbar"><button onclick="go(\'map\')">Vissza a térképre</button><button class="primary" onclick="finish()" '+(!ready()?'disabled':'')+'>Véglegesítés és beadás</button></div></section>'}

function correctText(i){return i===5?'Sonka, szalámi, sajt':i===4?'Kávé, tej':i===6?'Piskóta, fagylalt, tejberizs, tejszínhab':i===17?'Nyugati pályaudvar → 4-es/6-os villamos → Blaha Lujza tér → New York Kávéház':questions[i][2][questions[i][3]]}
function resultRow(i){let ok=state.answers[i]===questions[i][3];return '<div class="resultrow '+(ok?'resultok':'resultwrong')+'"><div class="resultheading"><strong>'+esc(resultLabel(i))+'</strong><span class="pointpill">'+(ok?'✓ 2 / 2 pont':'−2 pont')+'</span></div><p><strong>Válaszod:</strong> '+esc(shown(i))+'</p><p><strong>Helyes megoldás:</strong> '+esc(correctText(i))+'</p></div>'}
function resultDetails(){let wrong=questions.map((q,i)=>i).filter(i=>state.answers[i]!==questions[i][3]);return '<div class="resultsummary"><h3>Hol vesztettél pontot?</h3>'+(wrong.length?'<p>'+wrong.length+' feladatnál vesztettél összesen '+(40-score())+' pontot. A részletek az alábbiakban láthatók.</p>'+wrong.map(resultRow).join(''):'<p class="good">Minden feladat helyes, nem vesztettél pontot. Gratulálunk!</p>')+'</div><details class="allresults"><summary>Az összes feladat és megoldás ('+questions.length+')</summary>'+rooms.map(r=>'<section><h3>'+r.icon+' '+r.title+' · '+r.ids.reduce((n,i)=>n+(state.answers[i]===questions[i][3]?2:0),0)+' / '+(r.ids.length*2)+' pont</h3>'+r.ids.map(resultRow).join('')+'</section>').join('')+'</details>'}
function ending(){return '<section class="panel"><div class="eyebrow">A küldetés véget ért</div><h2>Megvan a visszatérőjegy!</h2><div class="resultbig">'+score()+' / 40 pont</div>'+resultDetails()+'<p>A korabeli társak a kávéházban maradnak, hogy megvárják új ismerőseiket. 2026-ban a jegy felragyog: az időkapu megnyílik. A mai fiatalok átlépnek a századfordulóra, a visszatérőjegyet biztonságba teszik, majd a New York felé indulnak. A körúton a szél egy összegyűrt papírlapot sodor a lábuk elé.</p><div class="finalpaper"><div class="eyebrow">Az utolsó nyom</div><h2>Egy eldobott kézirat…</h2><p>A papíron egy vers sorai látszanak. Ismerősnek tűnnek. Vajon ki írta? Miért dobta el? És mi történik, ha senki sem menti meg?</p><p><strong>A történet a következő irodalomórán folytatódik. Két korabeli vendég már a kávéházban ül. A mai fiatalok hamarosan megérkeznek a kézirattal.</strong></p></div></section>'}
function stationNav(){return '<div class="stationnav" aria-label="Helyszínek közötti navigáció"><div class="stationnavhead"><strong>Helyszínek</strong><button class="primary" onclick="overview()">🧾 Ellenőrző könyv</button></div><div class="stationnavgrid">'+rooms.map((r,i)=>'<button '+(i>state.items.length?'disabled':'')+' '+(state.page==='room'&&state.room===i?'aria-current="step"':'')+' onclick="openRoom('+i+')"><span>'+ (i+1)+'. '+r.icon+'</span><span>'+r.title+'</span><small>'+(i>state.items.length?'🔒 Zárva':state.items.includes(i)?'✓ Bejárva':'Megnyitva')+'</small></button>').join('')+'</div></div>'}
function render(){if(guideOnly){app.innerHTML=learn();return}if(state.legacy){app.innerHTML='<section class="panel"><h2>Korábbi lezárt próbálkozás</h2><p>A régi verzió eredményét megőriztük. Az új játékhoz a Moodle-ban új próbálkozást kell indítani.</p></section>';return}if(state.page==='home'){app.innerHTML=home();return}if(state.page==='learn'){app.innerHTML=learn();return}if(state.done){app.innerHTML=ending();return}let content=state.page==='room'?roomPage():state.page==='review'?reviewPage():map();app.innerHTML=stationNav()+'<div class="layout"><div>'+content+'</div>'+inventory()+'</div>'}
document.querySelector('nav').innerHTML=guideOnly?'<span class="navtitle">📖 Önálló kalauz · pontozás nélkül</span>':'<button onclick="go(\'home\')">☕ Kezdőlap</button><button onclick="go(\'learn\',0)">Kalauz itt</button>'+guideLink+'<button onclick="go(\'map\')">🗝️ Nyomozás</button><button onclick="overview()">🧾 Ellenőrző könyv</button>'+(!api?'<button onclick="resetDemo()">↻ Új játék</button>':'');
if(guideOnly)state.page='learn';render();

</script></html>
